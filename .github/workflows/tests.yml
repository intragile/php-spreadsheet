name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "7 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, xmlreader
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G

  xls-adapter:
    # The optional XLS reader against the lowest phpoffice/phpspreadsheet release Composer will
    # install (releases with security advisories are skipped).
    runs-on: ubuntu-latest
    name: XLS adapter (lowest phpspreadsheet)
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, xmlreader, gd
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer update phpoffice/phpspreadsheet --prefer-lowest --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit tests/Xls tests/Inspection

  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  next-versions:
    # Early warning against the next PHP release,
    # installed with minimum-stability dev. Static analysis and style are left to the jobs
    # above. A failure here does not fail the run, so check this job's result.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.6' }
    name: Next / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, xmlreader
          coverage: none
      - name: Retarget composer.json at the upcoming versions
        run: |
          php -r '
            $c = json_decode(file_get_contents("composer.json"), true);
            foreach (["larastan/larastan", "phpstan/phpstan", "laravel/pint"] as $tool) {
                unset($c["require-dev"][$tool]);
            }
            if (isset($c["require-dev"]["orchestra/testbench"])) {
                $c["require-dev"]["orchestra/testbench"] = getenv("TESTBENCH") ?: "*";
            }
            $laravel = (string) getenv("LARAVEL");
            foreach (["require", "require-dev"] as $section) {
                foreach (array_keys($c[$section] ?? []) as $name) {
                    if ($laravel !== "" && str_starts_with($name, "illuminate/")) {
                        $c[$section][$name] = $laravel;
                    }
                }
            }
            $c["minimum-stability"] = "dev";
            $c["prefer-stable"] = true;
            file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          '
      - run: composer update --prefer-dist --no-interaction --no-progress --ignore-platform-req=php+
      - run: vendor/bin/phpunit
